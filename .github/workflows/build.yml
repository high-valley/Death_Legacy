name: Build & Deploy

# main に push すると:
#   1. 単体テスト（ヘッドレス）
#   2. Web版を書き出して GitHub Pages に公開
#   3. Windows版を書き出して Actions の成果物（Artifacts）に保存 → Steam 提出前の動作確認用
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE }}-web-win

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot/templates && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot && rm godot.zip
          curl -fsSL -o tpl.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q -j tpl.tpz \
            templates/version.txt \
            templates/web_nothreads_release.zip templates/web_nothreads_debug.zip \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            -d templates
          rm tpl.tpz

      - name: Install export templates
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"

      - name: Font glyph check
        run: pip install --quiet fonttools && python3 tools/check_glyphs.py

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Unit tests
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee test.log
          # GDScript の実行時エラーはテストを止めないので、ログに出たら失敗扱いにする
          if grep -q "SCRIPT ERROR" test.log; then echo "::error::SCRIPT ERROR がテスト中に発生"; exit 1; fi

      - name: Smoke run (game boots without script errors)
        run: |
          # 描画・UIのスクリプトは単体テストから読まれないので、実際に3秒起動してコンパイルエラーを拾う
          ~/godot/godot --headless --path . --quit-after 180 2>&1 | tee smoke.log || true
          if grep -q "SCRIPT ERROR" smoke.log; then echo "::error::起動時に SCRIPT ERROR"; exit 1; fi

      - name: Export Web (single-threaded, works on GitHub Pages)
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - name: Export Windows
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/DeathLegacy.exe
          test -f build/windows/DeathLegacy.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DeathLegacy-windows-${{ github.sha }}
          path: build/windows
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
